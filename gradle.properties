org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# Internal Kotlin/module namespace — every module's `namespace` in its own
# build.gradle.kts derives from this, and it must keep matching the actual
# `package xyz.mdhv.riverwip...` declarations throughout the source tree (the
# generated R class only resolves unqualified when namespace == source
# package). Renaming this for real means moving every module's Kotlin package
# + directory structure, not just this line — out of scope for the Play
# Console package rename below, so this one stays as-is.
riverwip.packageBase=xyz.mdhv.riverwip

# The app's public-facing identity — the package registered in Play Console.
# Only app/build.gradle.kts's `applicationId` uses this; deliberately a
# separate property from riverwip.packageBase above (see its comment).
riverwip.applicationId=dev.asystemofcells.nooz
