<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nooz</title>
<meta name="description" content="See what flowed from your chosen sources, and what you actually read.">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nooz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
<style>
  @font-face {
    font-family: 'PT Serif';
    src: url('fonts/pt_serif_regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Hyle Grotesk';
    src: url('fonts/hyle_grotesk_classic_regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Hyle Grotesk';
    src: url('fonts/hyle_grotesk_classic_medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Hyle Grotesk';
    src: url('fonts/hyle_grotesk_classic_bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
</style>
</head>
<body>
<div id="app"><div class="nooz-boot">
  <p class="nooz-boot-wordmark">Nooz</p>
  <p class="nooz-boot-tagline">See what flowed from your chosen sources, and what you actually read.</p>
  <noscript><p class="nooz-boot-noscript">Nooz needs JavaScript enabled to run. It is a fully client-side reader with no account, no server, and no sync.</p></noscript>
</div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
