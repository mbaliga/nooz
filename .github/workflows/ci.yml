name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, Android-SDK-free gate: the pure-Kotlin domain + analysis core.
  # These tests hold the load-bearing math (river decomposition, dedup,
  # classifier evidence, lens fidelity guard, CVD palette) and must be green.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure-JVM core unit tests
        run: ./gradlew :core:model:test --stacktrace

  # Full Android build: assemble both flavors, unit tests, lint.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (both flavors)
        run: ./gradlew testFossDebugUnitTest testFullDebugUnitTest --stacktrace

      - name: Lint (foss)
        run: ./gradlew lintFossDebug --stacktrace

      - name: Assemble (both flavors)
        run: ./gradlew assembleFossDebug assembleFullDebug --stacktrace
